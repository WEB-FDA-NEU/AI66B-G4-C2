<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discussions — Tech4Rum</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <site-header></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <!-- ---------- LEFT RAIL ---------- -->
    <aside class="sidebar-left sm:d-none" aria-label="Section navigation">
      <nav class="s-navigation s-navigation__vertical">
        <a class="s-navigation--item" href="./index.html">Home</a>
        <a class="s-navigation--item" href="./questions.html">Questions</a>
        <a class="s-navigation--item is-selected" href="./discussions.html" aria-current="page">Discussion</a>
        <a class="s-navigation--item" href="#">Tags</a>
        <a class="s-navigation--item" href="#">Users</a>
        <a class="s-navigation--item" href="./admin.html">Admin</a>
      </nav>
    </aside>

    <!-- ---------- MAIN ---------- -->
    <main id="main" class="question-feed">

      <div class="d-flex ai-center jc-space-between g8 mb16">
        <h1 class="fs-headline1 fw-normal mb0">Discussions</h1>
        <a class="s-btn" href="./create-discussion.html">Start a discussion</a>
      </div>

      <div class="d-flex ai-center jc-space-between g8 fw-wrap mb16">
        <div class="fc-black-500 fs-caption" data-discussion-count>Loading…</div>

        <nav class="s-navigation s-navigation__sm" aria-label="Discussion filters">
          <a class="s-navigation--item is-selected" href="#" aria-current="true">Trending</a>
          <a class="s-navigation--item" href="#">Newest</a>
          <a class="s-navigation--item" href="#">Most upvotes</a>
          <a class="s-navigation--item" href="#">Most views</a>
          <a class="s-navigation--item" href="#">Most replies</a>
        </nav>
      </div>

      <!-- DISCUSSION LIST — populated by js/pages/discussions.js -->
      <div id="discussion-list" class="discussion-list"></div>

      <!-- Pagination -->
      <nav class="s-pagination jc-end mt24" aria-label="Pagination">
        <a class="s-pagination--item s-pagination--item__nav" href="#" aria-label="Previous page">
          <svg class="svg-icon" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12">
            <path d="M7.35.65 6.29 1.71 9.59 5H.65v1.5h8.94L6.29 9.79l1.06 1.06L12 6 7.35.65Z" transform="rotate(180 6 6)"/>
          </svg>
        </a>
        <a class="s-pagination--item is-selected" href="#" aria-current="page">1</a>
        <a class="s-pagination--item" href="#">2</a>
        <a class="s-pagination--item" href="#">3</a>
        <span class="s-pagination--item fc-black-400">…</span>
        <a class="s-pagination--item" href="#">148</a>
        <a class="s-pagination--item s-pagination--item__nav" href="#" aria-label="Next page">
          <svg class="svg-icon" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12">
            <path d="M7.35.65 6.29 1.71 9.59 5H.65v1.5h8.94L6.29 9.79l1.06 1.06L12 6 7.35.65Z"/>
          </svg>
        </a>
      </nav>

    </main>

    <!-- ---------- RIGHT RAIL ---------- -->
    <aside class="sidebar-right md:d-none" aria-label="Sidebar">

      <div class="widget">
        <div class="widget-header">Custom Filters</div>
        <div class="widget-body d-flex fd-column g16">

          <!-- Include tags -->
          <div class="d-flex fd-column g6">
            <span class="s-label s-label__sm">Include tags</span>
            <div class="d-flex fw-wrap g4">
              <span class="s-tag">
                devops
                <button type="button" class="s-tag--dismiss" aria-label="Remove tag devops">×</button>
              </span>
              <span class="s-tag">
                career
                <button type="button" class="s-tag--dismiss" aria-label="Remove tag career">×</button>
              </span>
            </div>
            <input class="s-input s-input__sm" type="text"
                   placeholder="Add a tag…" autocomplete="off"
                   aria-label="Add an included tag">
          </div>

          <!-- Ignore tags -->
          <div class="d-flex fd-column g6">
            <span class="s-label s-label__sm">Ignore tags</span>
            <div class="d-flex fw-wrap g4">
              <span class="s-tag s-tag__ignored">
                crypto
                <button type="button" class="s-tag--dismiss" aria-label="Remove tag crypto">×</button>
              </span>
            </div>
            <input class="s-input s-input__sm" type="text"
                   placeholder="Add a tag…" autocomplete="off"
                   aria-label="Add an ignored tag">
          </div>

        </div>
      </div>

    </aside>

  </div>

  <site-footer></site-footer>

  <script src="./js/pages/discussions.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>

</body>
</html>
