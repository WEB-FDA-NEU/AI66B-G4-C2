<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discussions — Tech4Rum</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>
  <site-header is-logged-in="true"></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">
    <site-sidebar class="ws2 flex__fl-shrink0 sm:d-none"></site-sidebar>

    <main id="main" class="fl-grow1">
      <div class="d-flex ai-center jc-space-between g8 mb16">
        <h1 class="fs-headline1 fw-normal mb0">Discussions</h1>
        <a class="s-btn" href="./create-discussion.html">Start a discussion</a>
      </div>

      <div class="d-flex ai-center jc-space-between g8 fw-wrap mb16">
        <div class="fc-black-500 fs-caption" data-discussion-count>Loading…</div>
        <nav class="s-navigation s-navigation__sm" aria-label="Discussion filters">
          <a class="s-navigation--item is-selected" href="#" aria-current="true">Trending</a>
          <a class="s-navigation--item" href="#">Newest</a>
          <a class="s-navigation--item" href="#">Most upvotes</a>
          <a class="s-navigation--item" href="#">Most views</a>
          <a class="s-navigation--item" href="#">Most replies</a>
        </nav>
      </div>

      <div id="discussion-list"></div>
    </main>

    <aside class="ws2 flex__fl-shrink0 md:d-none" aria-label="Sidebar">
      <div class="bg-white bc-light ba bar-md mb16">
        <div class="bb bc-black-150 p12 fw-bold fc-black-600">Custom Filters</div>
        <div class="p16 d-flex fd-column g16">
          <div class="d-flex fd-column g6">
            <span class="s-label s-label__sm">Include tags</span>
            <div class="d-flex fw-wrap g4">
              <span class="s-tag">devops</span>
              <span class="s-tag">career</span>
            </div>
            <input class="s-input s-input__sm" type="text" placeholder="Add a tag…" autocomplete="off">
          </div>
          <div class="d-flex fd-column g6">
            <span class="s-label s-label__sm">Ignore tags</span>
            <div class="d-flex fw-wrap g4">
              <span class="s-tag s-tag__ignored">crypto</span>
            </div>
            <input class="s-input s-input__sm" type="text" placeholder="Add a tag…" autocomplete="off">
          </div>
        </div>
      </div>
    </aside>
  </div>

  <site-footer></site-footer>

  <script type="module" src="./js/tag-url.js"></script>
  <script src="./js/pages/discussions.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>
  <script type="module" src="./js/components/site-sidebar.js"></script>
</body>
</html>
