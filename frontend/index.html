<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tech4Rum — Where developers learn, share, and build careers">
  <title>Tech4Rum — Where Developers Learn &amp; Share</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>

<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <site-header is-logged-in="true"></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <site-sidebar class="ws2 flex__fl-shrink0 sm:d-none"></site-sidebar>

    <main id="main" class="question-feed fl-grow1" role="main">

      <!-- Greeting card — minimal, static placeholder. A future JS module can update text via #greeting -->
      <section class="bg-white bc-light ba bar-md p16 mb24">
        <h1 id="greeting" class="fs-title fw-bold mb0">Welcome to Tech4Rum!</h1>
      </section>

      <!-- Recommended questions -->
      <section class="mb24">
        <header class="d-flex fd-column mb16">
          <div class="fs-title fw-bold">Interesting posts for you</div>
          <div class="fs-body1 fc-black-400">
            Let's solve the troubles you have!!
          </div>
        </header>
        <div id="question-list" class="question-list"></div>
      </section>

      <!-- Trending discussions -->
      <section class="mb24">
        <header class="d-flex fd-column mb16">
          <div class="fs-title fw-bold">Trending discussions</div>
          <div class="fs-body1 fc-black-400">
            Hottest conversations happening across the community right now.
          </div>
        </header>
        <div id="discussion-list" class="discussion-list"></div>
      </section>

    </main>
  </div>

  <site-footer></site-footer>

  <script type="module" src="./js/tag-url.js"></script>
  <script src="./js/render-questions.js" defer></script>
  <script src="./js/pages/discussions.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>
  <script type="module" src="./js/components/site-sidebar.js"></script>

</body>
</html>
