<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Tech4Rum — Where developers learn, share, and build careers">
  <title>Tech4Rum — Where Developers Learn &amp; Share</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<!--
  data-requires-role="user":
    - Guests are redirected to /questions.html by the backend middleware
      in backend/main.py (and again by page-guard.js as defence-in-depth).
    - Any logged-in user (user / moderator / admin) may view Home.
-->
<body class="home-page" data-requires-role="user">

  <!-- Pre-paint theme bootstrap. Must be first child of <body>. -->
  <script src="./js/theme-boot.js"></script>

  <!-- Page-level role guard. Defence-in-depth companion to the backend. -->
  <script src="./js/page-guard.js"></script>

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <!-- SITE HEADER — rendered by ./js/components/site-header.js -->
  <site-header is-logged-in="true"></site-header>

  <!-- MAIN LAYOUT -->
  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <!-- LEFT RAIL -->
    <site-sidebar active="home"></site-sidebar>

    <!-- MAIN CONTENT -->
    <main id="main" class="question-feed fl-grow1" role="main">

      <!--
        Greeting card. The h1 carries `data-greeting` — home-greeting.js
        swaps the text to "Welcome <display_name> to Tech4Rum!" once
        /api/auth/me resolves. The neutral default below is what
        renders before the fetch resolves and if the fetch fails.
      -->
      <section class="widget p16 mb24">
        <div class="d-flex jc-space-between ai-center g16 fw-wrap">
          <div class="fl-grow1">
            <h1 class="fs-title fw-bold mb0" data-greeting>Welcome to Tech4Rum!</h1>
          </div>
        </div>
      </section>

      <!-- Recommended questions -->
      <section class="mb24">
        <header class="d-flex fd-column mb16">
          <div class="fs-title fw-bold">Interesting posts for you</div>
          <div class="fs-body1 fc-black-400">
            Let's solve the troubles you have!!
          </div>
        </header>

        <!-- Populated by ./js/render-questions.js from /api/posts?type=question -->
        <div id="question-list" class="question-list"></div>
      </section>

      <!-- Trending discussions -->
      <section class="mb24">
        <header class="d-flex fd-column mb16">
          <div class="fs-title fw-bold">Trending discussions</div>
          <div class="fs-body1 fc-black-400">
            Hottest conversations happening across the community right now.
          </div>
        </header>

        <!-- Populated by ./js/pages/discussions.js from /api/posts?type=discussion -->
        <div id="discussion-list" class="discussion-list"></div>
      </section>

    </main>
  </div>

  <!-- SITE FOOTER — rendered by ./js/components/site-footer.js -->
  <site-footer></site-footer>

  <!-- Tag URL helper (must run before the feed renderers) -->
  <script type="module" src="./js/tag-url.js" defer></script>

  <!-- Feed renderers — same scripts used by questions.html and discussions.html -->
  <script src="./js/render-questions.js" defer></script>
  <script src="./js/pages/discussions.js" defer></script>

  <!-- Dynamic greeting — swaps "Welcome to Tech4Rum!" with the logged-in
       user's display_name once /api/auth/me resolves. Independent of the
       feeds above; no shared state. -->
  <script src="./js/home-greeting.js" defer></script>

  <script type="module" src="./js/components/site-header.js" defer></script>
  <script type="module" src="./js/components/site-footer.js" defer></script>
  <script type="module" src="./js/components/site-sidebar.js" defer></script>

</body>
</html>
