<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log In - Stack Overflow</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>
<body class="universal-auth-page unified-theme floating-content">
    <div class="container">
        <main id="content" class="d-flex flex__center snippet-hidden" tabindex="-1">
            <div class="flex--item">
                <div id="openid-buttons" class="mx-auto d-flex flex__fl-grow1 fd-column gs8 gsy mb16 wmx3">
                    <button class="flex--item s-btn s-btn__icon s-btn__google bar-md ba bc-black-225" type="button">
                        <svg aria-hidden="true" class="native svg-icon iconGoogle" width="18" height="18" viewBox="0 0 18 18">
                            <path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18"></path>
                            <path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17"></path>
                            <path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18z"></path>
                            <path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.8 4.8 0 0 1 4.48-3.3"></path>
                        </svg>
                        Log in with Google
                    </button>

                    <button class="flex--item s-btn s-btn__icon s-btn__github bar-md ba bc-black-225" type="button">
                        <svg aria-hidden="true" class="svg-icon iconGitHub" width="18" height="18" viewBox="0 0 18 18">
                            <path fill="#010101" d="M9 1a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 9 1"></path>
                        </svg>
                        Log in with GitHub
                    </button>

                    <button class="flex--item s-btn s-btn__icon s-btn__facebook bar-md" type="button">
                        <svg aria-hidden="true" class="svg-icon iconFacebook" width="18" height="18" viewBox="0 0 18 18">
                            <path fill="#0866FF" d="M9 1a8 8 0 0 1 .97 15.94v-5.5h2.16L12.58 9H9.97v-.86c0-1.3.5-1.8 1.82-1.8q.62 0 .92.04V4.16c-.36-.1-1.23-.2-1.74-.2-2.67 0-3.9 1.26-3.9 3.99V9H5.42v2.44h1.65v5.32A8 8 0 0 1 9 1"></path>
                        </svg>
                        Log in with Facebook
                    </button>
                </div>

                <div id="formContainer" class="mx-auto mb24 p24 wmx3 bg-white bar-lg bs-xl">
                    <form id="login-form" class="d-flex fd-column gs12 gsy" action="#" method="post">
                        <div class="flex--item d-flex fd-column gs4 gsy js-auth-item">
                            <label class="flex--item s-label" for="email">Email</label>
                            <div class="d-flex ps-relative">
                                <input class="s-input" id="email" type="email" size="30" maxlength="100" name="email" autocomplete="email">
                            </div>
                        </div>

                        <div class="flex--item d-flex fd-column-reverse gs4 gsy js-auth-item">
                            <div class="d-flex ps-relative js-password">
                                <input class="flex--item s-input" type="password" name="password" id="password" autocomplete="current-password">
                                <svg aria-hidden="true" class="ps-absolute r8 t8 c-pointer svg-icon iconEyeOffSm" width="14" height="14" viewBox="0 0 14 14">
                                    <path d="M3.52 7.38 1.58 9.26A12 12 0 0 1 0 7s2.63-5.14 7.05-5.14q.99.01 1.86.32L7.44 3.6 7 3.57a3.5 3.5 0 0 0-3.48 3.81M5.3 9.99c.5.28 1.1.44 1.71.44 1.94 0 3.5-1.53 3.5-3.43q-.01-.94-.47-1.72L8.7 6.6q.05.2.05.4a1.73 1.73 0 0 1-2.13 1.67zm6.23-6.19A13 13 0 0 1 14 7s-2.62 5.14-6.95 5.14A6 6 0 0 1 4 11.3L2.27 13l-1.4-1.36L11.9 1l1.23 1.2z"></path>
                                </svg>
                            </div>
                            <div class="d-flex ai-center ps-relative jc-space-between">
                                <label class="flex--item s-label" for="password">Password</label>
                                <a class="flex--item s-link fs-caption" href="#">Forgot password?</a>
                            </div>
                        </div>

                        <div class="flex--item d-flex gs4 gsy fd-column js-auth-item pb16 bb bc-black-225">
                            <button class="flex--item s-btn s-btn__filled" id="submit-button" name="submit-button" type="submit">Log in</button>
                        </div>
                    </form>
                </div>

                <div class="mx-auto ta-center fs-body1 p16 pb0 mb24 w100 wmx3">
                    Don&rsquo;t have an account? <a href="#">Sign up</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
