<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tag — Tech4Rum</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <!-- ================= TOP BAR ================= -->
  <site-header is-logged-in="true"></site-header>

  <!-- ================= PAGE ================= -->
  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <!-- ---------- LEFT RAIL ---------- -->
    <aside class="sidebar-left sm:d-none" aria-label="Section navigation">
      <nav class="s-navigation s-navigation__vertical">
        <a class="s-navigation--item" href="./index.html">Home</a>
        <a class="s-navigation--item" href="./questions.html">Questions</a>
        <a class="s-navigation--item" href="./discussions.html">Discussion</a>
        <a class="s-navigation--item is-selected" href="./tags.html" aria-current="page">Tags</a>
        <a class="s-navigation--item" href="./users.html">Users</a>
        <a class="s-navigation--item" href="./admin.html">Admin</a>
      </nav>
    </aside>

    <!-- ---------- MAIN ---------- -->
    <main id="main" class="question-feed">

      <!-- Tag header -->
      <h1 class="fs-headline1 fw-normal mb4" id="tag-name">tag</h1>
      <p class="fc-black-500 fs-body1 mb16" id="tag-description">Loading…</p>

      <!-- Type tabs -->
      <nav class="s-navigation mb12" id="type-tabs" aria-label="Post type">
        <button class="s-navigation--item is-selected" type="button" data-type="quest">Questions</button>
        <button class="s-navigation--item" type="button" data-type="discuss">Discussions</button>
      </nav>

      <div class="d-flex ai-center jc-space-between g8 fw-wrap mb16">
        <div class="fc-black-500 fs-caption" data-question-count>Loading…</div>

        <nav class="s-navigation s-navigation__sm" id="quest-filters" aria-label="Question filters">
          <a class="s-navigation--item is-selected" data-filter="trending" aria-current="true">Trending</a>
          <a class="s-navigation--item" data-filter="newest">Newest</a>
          <a class="s-navigation--item" data-filter="upvotes">Most upvotes</a>
          <a class="s-navigation--item" data-filter="views">Most views</a>
        </nav>

        <nav class="s-navigation s-navigation__sm d-none" id="discuss-filters" aria-label="Discussion filters">
          <a class="s-navigation--item is-selected" data-filter="trending" aria-current="true">Trending</a>
          <a class="s-navigation--item" data-filter="newest">Newest</a>
          <a class="s-navigation--item" data-filter="upvotes">Most upvotes</a>
          <a class="s-navigation--item" data-filter="views">Most views</a>
          <a class="s-navigation--item" data-filter="replies">Most replies</a>
        </nav>
      </div>

      <!-- POST LIST -->
      <div id="question-list" class="question-list"></div>

    </main>

  </div>

  <!-- ================= FOOTER ================= -->
  <site-footer></site-footer>

  <script src="./js/tag-detail.js" defer></script>
  <script type="module" src="./js/tag-url.js"></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>

</body>
</html>
