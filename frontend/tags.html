<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Tech4Rum — Tags">
  <title>Tags — Tech4Rum</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<body class="tags-page">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <!-- SITE HEADER -->
  <site-header is-logged-in="true"></site-header>

  <!-- MAIN LAYOUT -->
  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <!-- LEFT RAIL -->
    <aside class="sidebar-left sm:d-none" aria-label="Section navigation">
      <nav class="s-navigation s-navigation__vertical">
        <a class="s-navigation--item" href="#">Home</a>
        <a class="s-navigation--item" href="#">Questions</a>
        <a class="s-navigation--item" href="#">Discussion</a>
        <a class="s-navigation--item is-selected" href="#" aria-current="page">Tags</a>
        <a class="s-navigation--item" href="#">Users</a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main" class="fl-grow1" role="main">

      <h1 class="fs-headline1 mb16">Tags</h1>

      <p class="fs-body2 wmx6 mb16">
        A tag is a keyword or label that categorizes your question with other, similar questions.
        Using the right tags makes it easier for others to find and answer your question.
      </p>

      <!-- Tag-type legend -->
      <div class="d-flex fw-wrap g4 mb24 ai-center">
        <a class="flex--item s-tag s-tag__obc" href="#" title="This is an opinion-based tag.">opinion-based-tag</a>
        <a class="flex--item s-tag mr8" href="#" title="This is a standard tag. Every question must have at least one tag.">tag</a>
        <a class="flex--item s-link fs-body1" href="#">Show all tag synonyms</a>
      </div>

      <!-- Filter + sort row -->
      <div class="d-flex fw-wrap ai-center g8 mb16">

        <div class="ps-relative">
          <label class="v-visible-sr" for="tag-filter">Filter by tag name</label>
          <input id="tag-filter"
                 class="s-input s-input__search"
                 autocomplete="off"
                 name="tagfilter"
                 type="text"
                 maxlength="35"
                 placeholder="Filter by tag name">
          <svg aria-hidden="true" class="s-input-icon s-input-icon__search svg-icon"
               width="18" height="18" viewBox="0 0 18 18">
            <path d="m18 16.5-5.14-5.18h-.35a7 7 0 1 0-1.19 1.19v.35L16.5 18zM12 7A5 5 0 1 1 2 7a5 5 0 0 1 10 0"/>
          </svg>
        </div>

        <div class="ml-auto s-btn-group" role="group" aria-label="Sort tags" data-sort-nav>
          <button type="button" class="s-btn s-btn__muted is-selected" data-sort="popular" aria-pressed="true">
            <span class="s-btn--text">Popular</span>
          </button>
          <button type="button" class="s-btn s-btn__muted" data-sort="name" aria-pressed="false">
            <span class="s-btn--text">Name</span>
          </button>
          <button type="button" class="s-btn s-btn__muted" data-sort="new" aria-pressed="false">
            <span class="s-btn--text">New</span>
          </button>
        </div>
      </div>

      <!-- Filter summary (only visible while filtering) -->
      <div class="fs-body1 fc-black-400 mb16" data-tag-summary hidden></div>

      <!-- Tags grid — populated by ./js/pages/tags.js -->
      <div id="tags-list"
           class="d-grid grid__4 lg:grid__3 md:grid__2 sm:grid__1 g12"
           role="list"
           aria-busy="true"></div>

      <!-- Pagination — populated by ./js/pages/tags.js -->
      <nav class="s-pagination mt24" data-pagination aria-label="Tags pagination"></nav>

    </main>
  </div>

  <!-- SITE FOOTER -->
  <site-footer></site-footer>

  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>
  <script type="module" src="./js/pages/tags.js"></script>

</body>
</html>
