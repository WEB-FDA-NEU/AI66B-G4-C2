<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile — Tech4Rum</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>
  <site-header is-logged-in="true"></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">
    <site-sidebar class="ws2 flex__fl-shrink0 sm:d-none"></site-sidebar>

    <main id="main" class="fl-grow1">
      <div id="profile-status" class="fc-black-500 fs-body1">Loading…</div>
      <section id="profile-header" class="d-none"></section>

      <nav class="s-navigation mb16 d-none" id="profile-tabs" aria-label="Profile sections">
        <button class="s-navigation--item is-selected" type="button" data-tab="profile">Profile</button>
        <button class="s-navigation--item" type="button" data-tab="questions">Questions</button>
        <button class="s-navigation--item" type="button" data-tab="discussions">Discussions</button>
        <button class="s-navigation--item" type="button" data-tab="answers">Answers</button>
      </nav>

      <div id="profile-content" class="d-none"></div>
    </main>
  </div>

  <site-footer></site-footer>

  <script src="./js/render-user-profile.js" defer></script>
  <script type="module" src="./js/tag-url.js"></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>
  <script type="module" src="./js/components/site-sidebar.js"></script>
</body>
</html>
