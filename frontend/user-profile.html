<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile — Tech4Rum</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <!-- ================= TOP BAR ================= -->
  <site-header></site-header>

  <!-- ================= PAGE ================= -->
  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <!-- ---------- LEFT RAIL ---------- -->
    <aside class="sidebar-left sm:d-none" aria-label="Section navigation">
      <nav class="s-navigation s-navigation__vertical">
        <a class="s-navigation--item" href="./home_beta.html">Home</a>
        <a class="s-navigation--item" href="./questions.html">Questions</a>
        <a class="s-navigation--item" href="./discussions.html">Discussion</a>
        <a class="s-navigation--item" href="./tag-detail.html">Tags</a>
        <a class="s-navigation--item is-selected" href="#" aria-current="page">Users</a>
        <a class="s-navigation--item" href="./admin.html">Admin</a>
      </nav>
    </aside>

    <!-- ---------- MAIN ---------- -->
    <main id="main" class="user-profile-page">

      <!-- Loading / Error notice -->
      <div id="profile-status" class="fc-black-500 fs-body1">Loading…</div>

      <!-- Profile header (rendered by JS) -->
      <section id="profile-header" class="d-none"></section>

      <!-- Tabs -->
      <nav class="s-navigation mb16 d-none" id="profile-tabs" aria-label="Profile sections">
        <button class="s-navigation--item is-selected" type="button" data-tab="profile">Profile</button>
        <button class="s-navigation--item" type="button" data-tab="questions">Questions</button>
        <button class="s-navigation--item" type="button" data-tab="answers">Answers</button>
        <button class="s-navigation--item" type="button" data-tab="tags">Tags</button>
      </nav>

      <!-- Tab panels (rendered by JS) -->
      <div id="profile-content" class="d-none"></div>

    </main>

  </div>

  <!-- ================= FOOTER ================= -->
  <site-footer></site-footer>

  <script src="./js/render-user-profile.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>

</body>
</html>
