<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — Tech4Rum</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>
<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>
  <site-header is-logged-in="true"></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">
    <site-sidebar class="ws2 flex__fl-shrink0 sm:d-none"></site-sidebar>

    <main id="main" class="fl-grow1">
      <div class="d-flex ai-center jc-space-between g8 mb16">
        <h1 class="fs-headline1 fw-normal mb0">Users</h1>
      </div>

      <div class="d-flex ai-center jc-space-between g8 fw-wrap mb16">
        <div class="fc-black-500 fs-caption" data-user-count>Loading…</div>
        <nav class="s-navigation s-navigation__sm" id="user-sort" aria-label="Sort users">
          <a class="s-navigation--item is-selected" data-sort="reputation" aria-current="true">Top reputation</a>
          <a class="s-navigation--item" data-sort="name">Name</a>
        </nav>
      </div>

      <div id="user-list" class="d-grid grid__3 g16"></div>
    </main>
  </div>

  <site-footer></site-footer>

  <script src="./js/render-users.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>
  <script type="module" src="./js/components/site-sidebar.js"></script>
</body>
</html>
