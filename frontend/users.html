<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — Tech4Rum</title>

  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/extra.css">
</head>

<body class="theme-light">

  <a href="#main" class="v-visible-sr">Skip to main content</a>

  <site-header is-logged-in="true"></site-header>

  <div class="d-flex ai-start g24 wmx12 mx-auto px16 py24">

    <aside class="sidebar-left sm:d-none" aria-label="Section navigation">
      <nav class="s-navigation s-navigation__vertical">
        <a class="s-navigation--item" href="./index.html">Home</a>
        <a class="s-navigation--item" href="./questions.html">Questions</a>
        <a class="s-navigation--item" href="./discussions.html">Discussion</a>
        <a class="s-navigation--item" href="./tags.html">Tags</a>
        <a class="s-navigation--item is-selected" href="./users.html" aria-current="page">Users</a>
        <a class="s-navigation--item" href="./admin.html">Admin</a>
      </nav>
    </aside>

    <main id="main" class="question-feed">

      <div class="d-flex ai-center jc-space-between g8 mb16">
        <h1 class="fs-headline1 fw-normal mb0">Users</h1>
      </div>

      <!-- Search + sort row (mirrors the tag listing) -->
      <div class="d-flex fw-wrap ai-center g8 mb16">
        <div class="ps-relative">
          <label class="v-visible-sr" for="user-filter">Filter by name</label>
          <input id="user-filter"
                 class="s-input s-input__search"
                 autocomplete="off"
                 name="userfilter"
                 type="text"
                 maxlength="30"
                 placeholder="Filter by name">
          <svg aria-hidden="true" class="s-input-icon s-input-icon__search svg-icon"
               width="18" height="18" viewBox="0 0 18 18">
            <path d="m18 16.5-5.14-5.18h-.35a7 7 0 1 0-1.19 1.19v.35L16.5 18zM12 7A5 5 0 1 1 2 7a5 5 0 0 1 10 0"/>
          </svg>
        </div>

        <nav class="s-navigation s-navigation__sm ml-auto" id="user-sort" aria-label="Sort users">
          <a class="s-navigation--item is-selected" data-sort="reputation" aria-current="true">Top reputation</a>
          <a class="s-navigation--item" data-sort="name">Name</a>
        </nav>
      </div>

      <!-- Filter / total summary (populated by JS) -->
      <div class="fs-body1 fc-black-400 mb16" data-user-summary></div>

      <!-- User grid — populated by ./js/render-users.js -->
      <div id="user-list" class="d-grid grid__3 gx16 gy0" role="list" aria-busy="true"></div>

      <!-- Pagination — populated by ./js/render-users.js -->
      <nav class="s-pagination mt24" data-pagination aria-label="Users pagination"></nav>

    </main>

  </div>

  <site-footer></site-footer>

  <script src="./js/render-users.js" defer></script>
  <script type="module" src="./js/components/site-header.js"></script>
  <script type="module" src="./js/components/site-footer.js"></script>

</body>
</html>
